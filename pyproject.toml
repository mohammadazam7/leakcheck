[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "0.0.1"
description = "Find data leakage in a train/test split before you trust the score."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mohammad Azam" }]
keywords = ["machine-learning", "data-leakage", "evaluation", "train-test-split", "pytest"]
dependencies = ["pyarrow>=16"]

[project.urls]
Repository = "https://github.com/mohammadazam7/leakcheck"

[project.optional-dependencies]
dev = ["numpy>=1.26", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
